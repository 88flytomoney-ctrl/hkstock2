name: Daily Pipeline — Scrape + Prices + Deploy

on:
  schedule:
    # Midday run: 12:30 HKT (04:30 UTC) Mon-Fri
    - cron: '30 4 * * 1-5'
    # Evening run: 17:00 HKT (09:00 UTC) Mon-Fri
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Step 1: Scrape current stock data ───────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          pip install requests pandas tushare openpyxl openai yfinance -q

      - name: Scrape ETNet + Fetch prices
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python generate_predictions.py

      - name: Verify outputs
        run: |
          python -c "
          import json
          with open('public/data/predictions.json') as f:
              p = json.load(f)
          stocks_db = p.get('stocks', {})
          indices_db = p.get('indices', {})
          ai_count = sum(1 for v in stocks_db.values() if v.get('has_ai'))
          print(f'Predictions: {len(stocks_db)} stocks | With AI: {ai_count}')
          print(f'Indices: {list(indices_db.keys())}')
          for code, v in sorted(stocks_db.items()):
              ai = '✅' if v.get('has_ai') else '❌'
              rec = v.get('recommendation', '')
              print(f'  {ai} {code}: {v[\"name\"]} [{rec}]')
          "

      # ── Step 2: Generate daily report ────────────────────────────────────────
      - name: Build daily report
        run: python build_dl_report.py

      # ── Step 3: Commit stock data + predictions ──────────────────────────────
      - name: Commit data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/predictions.json public/data/history/ public/report.html
          git diff --staged --quiet && echo "No data changes" || \
            git commit -m "🤖 Auto-update data + AI predictions $(date +%Y-%m-%d\ %H:%M)" && \
            git pull --ff-only || echo "Force pushing..." && \
            git push --force-with-lease

      # ── Step 4: Build frontend ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      # ── Step 4: Deploy to GitHub Pages ─────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
